[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okta-inspector"
version = "3.0.0"
description = "Multi-framework compliance audit tool for Okta environments"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Ethan Troy" }]
keywords = ["okta", "compliance", "fedramp", "stig", "audit", "cmmc", "irap", "ismap", "soc2", "pci-dss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
]

[project.scripts]
okta-inspector = "okta_inspector.cli:main"
okta-audit = "okta_inspector.cli:main"

[project.urls]
Homepage = "https://github.com/ethanolivertroy/okta-inspector"
Repository = "https://github.com/ethanolivertroy/okta-inspector"

[tool.hatch.build.targets.wheel]
packages = ["src/okta_inspector"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
